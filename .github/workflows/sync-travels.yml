name: Sync TRACKiT travels

on:
  schedule:
    # Every 15 minutes — balances data freshness against load on TRACKiT's API
    # (which itself only allows ~1 request/second per account).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Avoid two invocations racing on the same sync run (e.g. a manual dispatch
# firing while the scheduled run is still working through its batches).
concurrency:
  group: sync-travels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Call /api/sync/travels until done
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_BASE_URL:-}" ]; then
            echo "SYNC_BASE_URL repository variable is not set (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi

          URL="${SYNC_BASE_URL%/}/api/sync/travels"
          MAX_ITERATIONS=30
          RUN_ID=""

          for i in $(seq 1 "$MAX_ITERATIONS"); do
            if [ -n "$RUN_ID" ]; then
              BODY=$(jq -n --arg runId "$RUN_ID" '{runId: $runId}')
            else
              BODY="{}"
            fi

            echo "iteration $i: POST $URL"
            HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST "$URL" \
              -H "Authorization: Bearer $SYNC_SECRET" \
              -H "Content-Type: application/json" \
              -d "$BODY")

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "sync request failed with HTTP $HTTP_CODE" >&2
              cat response.json >&2
              exit 1
            fi

            RUN_ID=$(jq -r '.runId' response.json)
            HAS_MORE=$(jq -r '.hasMore' response.json)
            VEHICLES_PROCESSED=$(jq -r '.vehiclesProcessed' response.json)
            VEHICLES_TOTAL=$(jq -r '.vehiclesTotal' response.json)
            TRAVELS_UPSERTED=$(jq -r '.travelsUpsertedTotal' response.json)
            VEHICLE_ERROR_COUNT=$(jq -r '.vehicleErrors | length' response.json)

            echo "runId=$RUN_ID vehiclesProcessed=$VEHICLES_PROCESSED/$VEHICLES_TOTAL travelsUpserted=$TRAVELS_UPSERTED vehicleErrors=$VEHICLE_ERROR_COUNT hasMore=$HAS_MORE"

            if [ "$HAS_MORE" != "true" ]; then
              echo "sync run $RUN_ID complete"
              exit 0
            fi
          done

          echo "hit safety limit of $MAX_ITERATIONS iterations without completing (runId=$RUN_ID) — investigate before it runs again" >&2
          exit 1
