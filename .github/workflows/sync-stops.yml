name: Sync TRACKiT stops

on:
  # Every 10 minutes. Left disabled for now — enable by uncommenting the cron
  # once the ping pipeline is meant to run live. Consider a phase offset (e.g.
  # "3-59/10 * * * *") so it lands a few minutes after a positions run.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {}

# One invocation at a time — a manual dispatch must not overlap a scheduled run.
concurrency:
  group: sync-stops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # detect_stops() resumes per-vehicle from the last stop, so per-run work is
    # bounded by "pings since last run". The route caps at maxDuration=300.
    timeout-minutes: 10
    steps:
      - name: POST /api/sync/stops
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_BASE_URL:-}" ]; then
            echo "SYNC_BASE_URL repository variable is not set (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi

          URL="${SYNC_BASE_URL%/}/api/sync/stops"
          echo "POST $URL"
          # --http1.1: works around a known HTTP/2 negotiation bug on Ubuntu
          # runners that surfaces as curl: (43).
          HTTP_CODE=$(curl -sS --http1.1 -o response.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "Content-Type: application/json")

          cat response.json && echo

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "stops sync failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi

          echo "stops sync ok (HTTP $HTTP_CODE)"
